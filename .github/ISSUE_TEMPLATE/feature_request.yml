name: Feature request
description: A change or an addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you want to do that the platform does not support today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you have in mind, and whether it affects the invariants or the committed results.
