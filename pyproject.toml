[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-workload-platform"
version = "0.1.0"
description = "Control plane for AI workloads on shared compute resources."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
