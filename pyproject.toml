[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-workload-platform"
version = "0.2.0"
description = "Control plane for AI workloads on shared GPU compute (simulated GPUs): versioned state, reconciliation, fault injection."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "uvicorn>=0.30",
  "prometheus-client>=0.20",
  "kubernetes>=30",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-repeat>=0.9", "ruff>=0.6"]

[project.scripts]
awp = "ai_workload_platform.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_workload_platform"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
  "postgres: needs a PostgreSQL server (AWP_PG_DSN); skipped when none is reachable",
  "kube: needs a reachable Kubernetes cluster (AWP_KUBECONFIG); skipped when none is reachable",
  "slow: real processes or sockets",
]
